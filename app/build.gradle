plugins {
    id 'com.android.application'
}

android {
    namespace 'com.freechannel.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.freechannel.tv"
        // API 22 = Fire OS 5 (oldest Fire TV devices). Newer Fire OS / Google TV are all higher.
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
